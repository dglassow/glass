[package]
name = "glass-desktop"
version = "0.0.0"
edition = "2021"
description = "Glass desktop shell"
authors = ["Daniel Glassow"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Desktop-only binary crate (no [lib]/mobile targets): main.rs is the whole
# shell, and std::process covers the browser launch — no extra plugins.
[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
