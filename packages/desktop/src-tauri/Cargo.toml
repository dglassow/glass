[package]
name = "glass-desktop"
version = "0.0.0"
edition = "2021"
description = "Glass desktop shell"
authors = ["Daniel Glassow"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "glass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
