#cloud-config
# Configure sshd to accept ONLY the hub's reverse tunnel and expose :443.
# The tunnel user has no shell and can only bind :443 for remote forwarding.
users:
  - name: tunnel
    shell: /usr/sbin/nologin
    ssh_authorized_keys:
      - ${tunnel_ssh_pubkey}

write_files:
  - path: /etc/ssh/sshd_config.d/glass-relay.conf
    permissions: "0644"
    content: |
      # Allow a client to request binding on 0.0.0.0 (needed for -R 0.0.0.0:443).
      GatewayPorts clientspecified
      Match User tunnel
        AllowTcpForwarding remote
        PermitListen 443
        X11Forwarding no
        AllowAgentForwarding no
        PermitTTY no

runcmd:
  - systemctl restart sshd
